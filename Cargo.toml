[workspace]
resolver = "2"
members = [
    "crates/imp_graph_editor",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
imp_core_types = { path = "../imp-rs/crates/imp_core_types" }
iced = { version = "0.14", features = ["canvas"] }
native-theme-iced = { version = "0.7", default-features = false, features = ["widgets"] }
petgraph = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
