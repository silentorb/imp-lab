[workspace]
resolver = "2"
members = [
    "crates/imp_lab_extensions",
    "apps/tauri/src-tauri",
]
# Library crates (default) must not require WebKit/GTK from the desktop app.
default-members = [
    "crates/imp_lab_extensions",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
