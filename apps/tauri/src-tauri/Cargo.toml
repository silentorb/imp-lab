[package]
name = "imp_lab_tauri"
version = "0.1.0"
description = "Experimental Tauri host for Imp Lab (React UI)"
authors = ["you"]
edition = "2021"
license = "MIT"

[lib]
name = "imp_lab_tauri_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Enabled by `tauri build` / Windows cargo-xwin export. Without it, release
# binaries still load build.devUrl (localhost) instead of embedded frontendDist.
[features]
custom-protocol = ["tauri/custom-protocol"]
